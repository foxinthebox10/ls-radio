<style>
/* Car head unit: picture screen, amber readout, three big keys, station strip below. */
:root{
  --bg:#121110; --panel:#1c1a17; --line:#2e2a25; --fg:#f1ebe0; --dim:#8f877b; --amber:#ffb23e; --amber-ink:#1b1305; --warn:#ff7a59;
  --display:"Oswald","Arial Narrow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--mono);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  max-width:560px;margin:0 auto;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding-block:12px 10px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:15px}
.brand b{color:var(--amber)}
.toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.toggle input{appearance:none;width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .15s}
.toggle input:checked{background:var(--amber)}
.toggle input:checked::after{transform:translateX(16px);background:var(--amber-ink)}
.toggle input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.unit{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;flex:none}
.screen{position:relative;width:100%;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000}
.screen iframe,.screen #player{position:absolute;inset:0;width:100%;height:100%;border:0}
.screen .off[hidden]{display:none}
.screen .off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--dim);font-size:13px;line-height:1.6;padding:16px;pointer-events:none}
.hint{margin:8px 2px 0;font-size:12px;color:var(--amber);min-height:16px;line-height:1.4}
.hint.err{color:var(--warn)}

.readout{padding:10px 4px 2px;min-width:0}
.meta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.meta .live{color:var(--amber)}
#name{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(24px,7.4vw,32px);line-height:1.1;margin:4px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#artist{font-size:12px;letter-spacing:.06em;color:var(--amber);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:16px}
#song{font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:20px}
.bar{height:3px;background:var(--line);border-radius:2px;margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--amber)}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}

.keys{display:flex;justify-content:center;align-items:center;gap:22px;padding:10px 0 4px}
.keys button{border:0;border-radius:50%;width:66px;height:66px;background:var(--line);color:var(--fg);font-size:28px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.keys button:active{transform:scale(.94)}
.keys #play{width:84px;height:84px;background:var(--amber);color:var(--amber-ink);font-size:30px}
.keys button:focus-visible,.list button:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.list{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:12px -6px 0;padding:0 6px 16px;min-height:0}
  font:inherit;font-size:14px;color:var(--fg);background:none;border:0;border-bottom:1px solid var(--line);padding:13px 8px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.keys button:active{transform:none}.toggle input,.toggle input::after{transition:none}}
@media (max-height:700px){.keys button{width:56px;height:56px;font-size:24px}.keys #play{width:70px;height:70px}#name{font-size:24px}}
.stickrow{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--dim)}
.stickrow[hidden]{display:none}
.stickrow select{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.tools{display:flex;gap:8px;margin-top:12px;flex:none}
.tools input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.tools input::placeholder{color:var(--dim)}
.tools button{font:inherit;font-size:13px;color:var(--amber-ink);background:var(--amber);border:0;border-radius:10px;padding:0 14px;cursor:pointer;white-space:nowrap}
.tools input:focus-visible,.tools button:focus-visible,.stickrow select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.edithelp{margin:8px 2px 0;font-size:12px;color:var(--dim);flex:none}
.list{margin-top:8px}
.row{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.row[hidden]{display:none}
.row .pick{flex:1;min-width:0;display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;
  font:inherit;font-size:14px;color:var(--fg);background:none;border:0;padding:13px 8px;cursor:pointer}
.row .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .n{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#000;display:block}
.row small{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.row.on{background:#2a2112;border-radius:10px;border-color:transparent}
.row.on .pick{color:var(--amber);font-weight:600}
.row.on small{color:var(--amber)}
.row.on .n{box-shadow:0 0 0 2px var(--amber)}
.row .tick{display:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--dim)}
body.editing .row .pick{grid-template-columns:28px 1fr 22px}
body.editing .row small{display:none}
body.editing .row .tick{display:block}
body.editing .row:not(.dropped) .tick{background:var(--amber);border-color:var(--amber);box-shadow:inset 0 0 0 3px var(--panel)}
body.editing .row.dropped .nm{color:var(--dim)}
.row .linkto{flex:none;width:118px;font:inherit;font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 4px;margin-right:6px}
.row .linkto:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
body.editing .row{flex-wrap:wrap}
.row .rm{font:inherit;font-size:12px;color:var(--warn);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-right:6px;cursor:pointer}
.row .pick:focus-visible,.row .rm:focus-visible,.modes button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.modes{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px;flex:none}
.modes button{flex:1;font:inherit;font-size:13px;color:var(--dim);background:none;border:0;border-radius:9px;padding:8px 6px;cursor:pointer}
.modes button[aria-selected="true"]{background:var(--line);color:var(--fg);font-weight:600}
#ytwrap[hidden]{display:none}
#ytwrap{position:absolute;inset:0}
.filescreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center;
  background:radial-gradient(circle at 50% 40%,#2a2318 0%,#121110 70%);font-size:12px;color:var(--dim);line-height:1.5}
.filescreen[hidden]{display:none}
.disc{width:64px;height:64px;border-radius:50%;background:repeating-radial-gradient(circle,#1c1a17 0 3px,#24211c 3px 5px);border:2px solid var(--amber);position:relative;flex:none}
.disc::after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--amber)}
body.spinning .disc{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.addbig{font:inherit;font-size:14px;color:var(--amber-ink);background:var(--amber);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.addbig[hidden],.tools button[hidden]{display:none}
.art{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#000;box-shadow:0 0 0 2px var(--amber);flex:none}
.art[hidden],.disc[hidden]{display:none}
@media (prefers-reduced-motion:reduce){body.spinning .disc{animation:none}}
</style>
</head>

  const Y = YT.PlayerState;
  if (e.data === Y.PLAYING) { clearTimeout(watchdog); setHint(""); setPlaying(true); }
  else if (e.data === Y.BUFFERING) setPlaying(playing, "Tuning…");
  else setPlaying(false);
  if (e.data === Y.ENDED) { player.seekTo(range(M().cur)[0], true); player.playVideo(); }
}
function onYTError(e) {
  if (!isYT()) return;
  setPlaying(false);
  setHint("This station won't play on YouTube right now (error " + e.data + "). Try ⏩️ for the next one.", true);
}

// Audio (My files) events
audio.addEventListener("playing", () => { if (!isYT()) { setPlaying(true); setHint(""); } });
audio.addEventListener("pause", () => { if (!isYT()) { setPlaying(false); remember(); } });
audio.addEventListener("waiting", () => { if (!isYT()) setPlaying(playing, "Tuning…"); });
audio.addEventListener("ended", () => { if (!isYT()) { audio.currentTime = 0; audio.play().catch(() => {}); } });
audio.addEventListener("error", () => { if (!isYT() && audio.src) setHint("This file won't play. Try a different format (MP3 or M4A work best).", true); });

// Lock screen / Control Center: ⏮ ⏭ change station (My files only — YouTube owns its own controls)
function updateSession() {
  if (!("mediaSession" in navigator)) return;
  const ms = navigator.mediaSession;
  const set = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
  if (isYT() || !list().length) {
    ["play", "pause", "previoustrack", "nexttrack"].forEach(a => set(a, null));
    return;
  }
  lastMeta = ""; setMeta();
  set("play", () => { if (!playing) togglePlay(); });
  set("pause", () => { if (playing) togglePlay(); });
  set("previoustrack", () => step(-1));
  set("nexttrack", () => step(1));
  set("seekbackward", null); set("seekforward", null);   // show ⏮ ⏭ instead of ±10s
}

// Lock screen text: song on top, station underneath. Changes as the songs change.
let lastMeta = "";
function setMeta(tr) {
  if (!("mediaSession" in navigator) || isYT() || !list().length) return;
  const st = list()[here()];
  const artist = tr && tr[3] ? dec(tr[2]) : "";
  const title = tr ? dec(tr[3] || tr[2]) + (artist ? " – " + artist : "") : st.link ? "DJ, ads and idents" : st.name;
  const k = st.sid + "|" + title;
  if (k === lastMeta) return;
  lastMeta = k;
  try { navigator.mediaSession.metadata = new MediaMetadata({title, artist: st.name, album: artist,
    artwork: [{src: new URL(st.logo || "icon-512.png", location.href).href, sizes: "512x512", type: "image/png"}]}); } catch (e) {}
}

function setHint(t, err) { $("hint").textContent = t; $("hint").classList.toggle("err", !!err); }

// ---------- Readout ----------
function trackAt(st, t) {
  for (const tr of st.tracks) if (tr[1] > tr[0] && t >= tr[0] && t < tr[1]) return tr;
  return null;
}

function paint(scroll) {
  const L = list(), empty = !L.length, i = here();
  $("m-yt").setAttribute("aria-selected", String(isYT()));
  $("m-files").setAttribute("aria-selected", String(!isYT()));
  $("ytwrap").hidden = !isYT();
  $("off").hidden = !isYT() || ytReady;
  $("filescreen").hidden = isYT();
  $("add").hidden = isYT();
  $("addbig").hidden = !empty;
  $("fsmsg").textContent = empty ? "Add audio from your iPhone. Each file becomes a station." : "Plays in the background · ⏮ ⏭ on the lock screen change station";
  $("stickrow").hidden = !(isYT() && i === MP);
  $("stick").value = S.stick;
  if (empty) {
    $("num").textContent = "My files"; $("name").textContent = "No stations yet";
    $("artist").textContent = ""; $("song").textContent = "Tap + Add to pick audio files";
    $("tcur").textContent = $("tlen").textContent = "0:00"; $("fill").style.width = "0";
  } else {
    $("num").textContent = (M().cur === null ? "Radio off · " : "Station ") + String(i + 1).padStart(2, "0") + " / " + L.length;
    $("name").textContent = L[i].name;
  }
  const lg = !isYT() && !empty && L[i].logo;
  $("art").hidden = !lg; $("disc").hidden = !!lg;
  if (lg && $("art").getAttribute("src") !== lg) $("art").src = lg;
  renderList();
  const row = !empty && $("list").children[i];
  if (row) { row.classList.add("on"); if (scroll && !row.hidden) row.scrollIntoView({block: "nearest"}); }
  tick();
}

function tick() {
  const L = list(); if (!L.length) return;
  const i = here(), st = L[i], [a, b] = range(i);
  let t = (M().cur !== null && src.ready()) ? src.time() : 0;
  if (t < 1 && M().pos[key(i)]) t = where(i);                  // not started yet: show where it will start
  if (isYT() && ytReady && M().cur !== null && playing) {
    for (const [x, y] of (SKIPS[st.name] || [])) if (t > x && t < y) { player.seekTo(y, true); t = y; }
    if (t >= b - 0.5 || t < a - 2) { player.seekTo(a, true); t = a; }   // loop the station (or the stick)
  }
  const tr = trackAt(st, t);
  if (M().cur !== null) setMeta(tr);
  if (tr) {
    $("artist").textContent = dec(tr[3] ? tr[2] : st.name);
    $("song").textContent = dec(tr[3] || tr[2]);
    $("tcur").textContent = fmt(t - tr[0]); $("tlen").textContent = fmt(tr[1] - tr[0]);
    $("fill").style.width = Math.min(100, (t - tr[0]) / (tr[1] - tr[0]) * 100) + "%";
  } else {
    $("artist").textContent = M().cur === null ? "" : isYT() ? "On air" : "My files";
    $("song").textContent = M().cur === null ? "Tap ▶ or a station to tune in" : isYT() ? "DJ, ads and station idents" : st.name;
    $("tcur").textContent = fmt(t - a); $("tlen").textContent = fmt(b - a);
    $("fill").style.width = (b > a ? Math.min(100, (t - a) / (b - a) * 100) : 0) + "%";
  }
  [...$("list").children].forEach((row, k) => {
    const el = row.querySelector("small");
    const txt = editing ? "" : k === M().cur ? "now" : M().pos[key(k)] ? fmt(where(k)) : "";
    if (el && el.textContent !== txt) el.textContent = txt;
  });
}

// ---------- Station list, filter, choose, remove ----------
let editing = false;
function renderList() {
  const L = list(), box = $("list"), q = $("q").value.trim().toLowerCase();
  box.textContent = "";
  document.body.classList.toggle("editing", editing);
  L.forEach((st, i) => {
    const dropped = !!M().off[st.sid];
    const b = document.createElement("div");
    b.className = "row" + (dropped ? " dropped" : "");
    b.hidden = (q && !st.name.toLowerCase().includes(q)) || (!editing && dropped);
    b.innerHTML = `<button type="button" class="pick"><img class="n" alt="" loading="lazy"><span class="nm"></span><small></small><i class="tick" aria-hidden="true"></i></button>`;
    b.querySelector(".n").src = st.logo || "icon-180.png";
    b.querySelector(".nm").textContent = (editing && st.file && st.link) ? st.name + " · " + st.file : st.name;
    const pick = b.querySelector(".pick");
    pick.setAttribute("aria-pressed", editing ? String(!dropped) : "false");
    pick.onclick = () => {
      if (editing) { if (M().off[st.sid]) delete M().off[st.sid]; else M().off[st.sid] = true; save(); paint(); }
      else tune(i);
    };
    if (editing && !isYT()) {
      const pickSt = document.createElement("select");
      pickSt.className = "linkto"; pickSt.setAttribute("aria-label", "Station for " + st.file);
      pickSt.innerHTML = '<option value="">Own station</option>' + YTLIST.map(() => "<option></option>").join("");
      YTLIST.forEach((y, k) => { pickSt.options[k + 1].value = y.sid; pickSt.options[k + 1].textContent = y.name; });
      pickSt.value = st.link || "";
      pickSt.onchange = e => linkFile(st.sid, e.target.value);
      b.appendChild(pickSt);
      const x = document.createElement("button");
      x.type = "button"; x.className = "rm"; x.textContent = "Remove"; x.setAttribute("aria-label", "Remove " + st.name);
      x.onclick = () => removeFile(st.sid);
      b.appendChild(x);
    }
    if (i === here() && M().cur !== null) b.classList.add("on");
    box.appendChild(b);
  });
  const kept = L.length - L.filter(s => M().off[s.sid]).length;
  $("edit").textContent = editing ? "Done" : kept < L.length ? `Choose (${kept})` : "Choose";
  $("edit").hidden = !L.length;
  $("edithelp").hidden = !editing;
  $("edithelp").textContent = isYT() ? "Untick stations to drop them from ⏪️ ⏩️. Tap Done when finished."
                                     : "Pick which station each file is (for song names), untick to drop from ⏪️ ⏩️, or Remove. Tap Done when finished.";
}

// ---------- My files storage (IndexedDB, stays on this phone) ----------
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open("lsradio", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("files", {keyPath: "sid"});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function idb(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const tx = d.transaction("files", mode), st = tx.objectStore("files");
    const out = fn(st);
    tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
async function loadFiles() {
  try {
    const rows = await idb("readonly", st => st.getAll());
    rows.sort((a, b) => a.added - b.added);
    FILES.forEach(f => URL.revokeObjectURL(f.url));
    FILES = rows.map(r => {
      const yt = r.link && YTLIST.find(y => y.sid === r.link);
      return {sid: r.sid, file: r.name, link: yt ? yt.sid : "", name: yt ? yt.name : r.name, len: r.len,
              url: URL.createObjectURL(r.blob), tracks: yt ? yt.tracks : [], logo: yt ? yt.logo : ""};
    });
  } catch (e) { FILES = []; setHint("Couldn't open saved files on this device.", true); }
  if (M().last >= FILES.length && S.mode === "files") { S.files.last = 0; S.files.cur = null; }
}
function duration(file) {
  return new Promise(res => {
    const a = new Audio(), u = URL.createObjectURL(file);
    const done = d => { URL.revokeObjectURL(u); res(d); };
    a.preload = "metadata";
    a.onloadedmetadata = () => done(isFinite(a.duration) ? a.duration : 0);
    a.onerror = () => done(-1);
    setTimeout(() => done(0), 15000);
    a.src = u;
  });
}
async function addFiles(fileList) {
  const files = [...fileList]; if (!files.length) return;
  setHint(`Adding ${files.length} file${files.length > 1 ? "s" : ""}…`);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  let added = 0, bad = 0;
  for (const f of files) {
    const len = await duration(f);
    if (len < 0) { bad++; continue; }
    const base = f.name.replace(/\.[^.]+$/, "");
    const rec = {sid: "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
                 name: base, len, blob: f, added: Date.now() + added, link: guessStation(base)};
    try { await idb("readwrite", st => st.put(rec)); added++; }
    catch (e) { setHint("Your phone ran out of space for this app. Remove some stations and try again.", true); break; }
  }
  await loadFiles();
  paint(true); updateSession();
  if (added) setHint(`Added ${added} station${added > 1 ? "s" : ""}.` + (bad ? ` ${bad} file${bad > 1 ? "s" : ""} couldn't be read.` : ""));
  else if (bad) setHint("Those files couldn't be read as audio.", true);
}
function guessStation(fname) {
  const byId = YTLIST.find(y => fname.includes(y.vid));
  if (byId) return byId.sid;
  const norm = x => x.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const n = norm(fname);
  const byName = [...YTLIST].sort((a, b) => b.name.length - a.name.length).find(y => n.includes(norm(y.name)));
  return byName ? byName.sid : "";
}
async function linkFile(sid, link) {
  const d = await db();
  await new Promise((res, rej) => {
    const tx = d.transaction("files", "readwrite"), st = tx.objectStore("files"), g = st.get(sid);
    g.onsuccess = () => { if (g.result) { g.result.link = link; st.put(g.result); } };
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
  const curSid = S.files.cur !== null && FILES[S.files.cur] ? FILES[S.files.cur].sid : null;
  const f = FILES.find(x => x.sid === sid), yt = YTLIST.find(y => y.sid === link);
  if (f) { f.link = link; f.name = yt ? yt.name : f.file; f.tracks = yt ? yt.tracks : []; f.logo = yt ? yt.logo : ""; }
  if (curSid) S.files.cur = FILES.findIndex(x => x.sid === curSid);
  paint(); updateSession();
}
async function removeFile(sid) {
  const curSid = M().cur !== null && FILES[M().cur] ? FILES[M().cur].sid : null;
  if (curSid === sid) { audio.pause(); audio.removeAttribute("src"); audio.load(); S.files.cur = null; }
  await idb("readwrite", st => st.delete(sid));
  delete S.files.pos[sid]; delete S.files.off[sid];
  await loadFiles();
  const idx = curSid && curSid !== sid ? FILES.findIndex(f => f.sid === curSid) : -1;
  if (idx >= 0) S.files.cur = S.files.last = idx;
  else if (S.files.last >= FILES.length) S.files.last = 0;
  save(); paint(); updateSession();
}

// ---------- Switching source ----------
function setMode(mode) {
  if (S.mode === mode) return;
  remember();
  src.stop(); setPlaying(false);
  S.mode = mode; M().cur = null; editing = false; $("q").value = "";
  if (mode === "yt" && ytReady) {                              // cue the station you had, paused
    const i = M().last || 0, stt = where(i);
    M().pos[key(i)] = {t: stt, at: now()};
    player.cueVideoById({videoId: YTLIST[i].vid, startSeconds: stt});
    M().cur = i;
  }
  if (mode === "files" && FILES.length) M().cur = null;
  save(); setHint(""); paint(true); updateSession();
}

// ---------- Wiring ----------
const sel = $("stick");
sel.innerHTML = `<option value="">All sticks</option>` + STICKS.map(() => "<option></option>").join("");
STICKS.forEach((s, k) => { sel.options[k + 1].value = s[0]; sel.options[k + 1].textContent = s[0]; });
sel.onchange = e => setStick(e.target.value);

$("m-yt").onclick = () => setMode("yt");
$("m-files").onclick = () => setMode("files");
$("add").onclick = $("addbig").onclick = () => $("picker").click();
$("picker").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("q").oninput = () => { renderList(); tick(); };
$("edit").onclick = () => { editing = !editing; paint(); };
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("play").onclick = togglePlay;
$("live").checked = !!S.live;
$("live").onchange = e => { remember(); S.live = e.target.checked; save(); };
addEventListener("keydown", e => {
  if (e.target.closest("input,select")) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  if (e.key === " ") { e.preventDefault(); togglePlay(); }
});
setInterval(tick, 500);
setInterval(() => { if (playing) remember(); }, 2000);
addEventListener("pagehide", remember);
document.addEventListener("visibilitychange", () => { if (document.hidden) remember(); });

// Coming back: show the station you had on, paused until you press play.
S.yt.cur = null; S.files.cur = null;
paint(true);
loadFiles().then(() => { if (!isYT()) { paint(true); updateSession(); } });

window.onYouTubeIframeAPIReady = () => {
  const i = S.yt.last || 0;
  const remK = (i === MP && stick()) ? "mp:" + S.stick : String(i);
  const st = (() => { const keep = S.mode; S.mode = "yt"; const w = where(i); S.mode = keep; return w; })();
  S.yt.pos[remK] = {t: st, at: now()}; save();
  player = new YT.Player("player", {
    videoId: YTLIST[i].vid,
    playerVars: {playsinline: 1, controls: 0, disablekb: 1, rel: 0, fs: 0, iv_load_policy: 3, start: st,
                 origin: location.origin.startsWith("http") ? location.origin : undefined},
    events: {
      onReady: () => {
        ytReady = true;
        S.yt.cur = i;                                          // cued: one tap on the picture (or ▶) starts it
        if (isYT()) { paint(true); setPlaying(false); }
      },
      onStateChange: onYTState,
      onError: onYTError
    }
  });
};
setTimeout(() => { if (!ytReady) $("off").textContent = "Can't reach YouTube. Check your connection and reload."; }, 12000);
</script>
