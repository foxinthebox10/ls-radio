name: fetch-logos
on: push
jobs:
  fetch:
    if: contains(github.event.head_commit.message, '[fetch-logos]')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _src logos
          curl -sSL -A "Mozilla/5.0" -o logos/mediaplayer.png https://static.wikia.nocookie.net/gtawiki/images/0/0e/MediaPlayer-GTAO-HUDIcon.png
          file logos/mediaplayer.png
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add logos && git commit -m "Fetched logos" && git push
